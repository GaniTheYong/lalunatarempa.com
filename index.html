<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laluna Tarempa</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fafafa;
  color: #333;
}

/* HEADER */
header {
  background: white;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #eee;
}

header img {
  height: 40px;
}

/* HERO */
.hero {
  text-align: center;
  padding: 40px 20px;
}

.hero h1 {
  margin-bottom: 10px;
}

.btn {
  display: inline-block;
  padding: 10px 20px;
  background: #8b5e3c;
  color: white;
  text-decoration: none;
  border-radius: 5px;
}

/* MENU */
.menu-section {
  padding: 20px;
  max-width: 1000px;
  margin: auto;
}

iframe {
  width: 100%;
  height: 80vh;
  border: none;
  border-radius: 10px;
}

/* FOOTER */
footer {
  background: #1f1f1f;
  color: #ddd;
  padding: 40px 20px;
}

.footer-container {
  max-width: 1000px;
  margin: auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
}

.footer-left, .footer-right {
  width: 45%;
}

.footer-left p,
.footer-right p {
  margin: 8px 0;
}

.footer-left p::before,
.footer-right p::before {
  content: "• ";
  color: #4da6ff;
}

footer a {
  color: #4da6ff;
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
}
</style>

</head>
<body>

<header>
  <img src="Logo.jpg" alt="Laluna Tarempa">
</header>

<section class="hero">
  <h1>Masakan Melayu Khas Tarempa</h1>
  <p>Tempat Nongkrong Yang Asik Dengan Harga Terjangkau</p>
  <a id="waBtn" class="btn" target="_blank">Pesan via WhatsApp</a>
</section>

<section class="menu-section">
  <h2 style="text-align:center;">Menu</h2>

  <iframe id="menuFrame"></iframe>

  <p style="text-align:center; margin-top:10px;">
    Jika tidak tampil, 
    <a id="menuLink" target="_blank">klik di sini</a>
  </p>
</section>

<footer>
  <div class="footer-container">

    <div class="footer-left">
      <p>WA standby : <a id="waFooter" target="_blank"></a></p>
      <p>GoFood: <a id="gofoodLink" target="_blank">Laluna Tarempa</a></p>
      <p>GrabFood: <a id="grabfoodLink" target="_blank">Laluna Tarempa</a></p>
      <p>Instagram: <a id="igLink" target="_blank">@laluna_terempa</a></p>
    </div>

    <div class="footer-right">
      <p id="addressText"></p>
      <p>Google Maps: <a id="mapsLink" target="_blank">Restoran Laluna Tarempa</a></p>
    </div>

  </div>
</footer>

<script>
fetch('config.json')
  .then(res => res.json())
  .then(cfg => {

    // MENU
    document.getElementById('menuFrame').src = cfg.menu_pdf;
    document.getElementById('menuLink').href = cfg.menu_pdf_view;

    // WHATSAPP
    const whatsappUrl = "https://wa.me/" + cfg.whatsapp_number +
      (cfg.whatsapp_message ? "?text=" + encodeURIComponent(cfg.whatsapp_message) : "");

    document.getElementById('waBtn').href = whatsappUrl;
    document.getElementById('waBtn').innerText = cfg.whatsapp_text;

    document.getElementById('waFooter').href = whatsappUrl;
    document.getElementById('waFooter').innerText = cfg.footer.wa_display;

    // LINKS
    document.getElementById('gofoodLink').href = cfg.footer.gofood_link;
    document.getElementById('grabfoodLink').href = cfg.footer.grabfood_link;
    document.getElementById('igLink').href = cfg.footer.instagram_link;

    // ADDRESS
    document.getElementById('addressText').innerText = cfg.footer.address;
    document.getElementById('mapsLink').href = cfg.footer.maps_link;

  });
</script>

</body>
</html>
